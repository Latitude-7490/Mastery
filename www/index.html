<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1E9D8;--card:#FBF7EC;--ink:#1B2A41;--sub:#6B6A63;--acc:#D9562B;--ok:#2F7D5B;--okbg:#DCEBDD;--bad:#B3341F;--badbg:#F6D9D0;--gold:#E0A526;--sel:#F7E3B0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12151C;--card:#1B202B;--ink:#EFE7D6;--sub:#9A9A94;--acc:#F0733F;--ok:#6FCB9F;--okbg:#17322A;--bad:#FF8B73;--badbg:#3A1E1A;--sel:#3A3320;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12151C;--card:#1B202B;--ink:#EFE7D6;--sub:#9A9A94;--acc:#F0733F;--ok:#6FCB9F;--okbg:#17322A;--bad:#FF8B73;--badbg:#3A1E1A;--sel:#3A3320;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}
header{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{font:900 26px/1 'Fraunces',serif;letter-spacing:-.5px}.brand i{color:var(--acc);font-style:normal}
.stats{display:flex;gap:6px;margin-top:8px}
.stamp{border:2px solid var(--ink);border-radius:6px;padding:3px 8px;font-weight:700;font-size:13px;background:var(--card)}
.btn{background:var(--acc);color:#fff;border:2px solid var(--ink);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:10px}
.btn:disabled{opacity:.4;box-shadow:none;transform:none}
main{padding:22px 20px;flex:1;display:flex;flex-direction:column}
h2{font:900 28px/1.1 'Fraunces',serif;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 18px}
.row{display:flex;gap:8px;margin-bottom:14px}
.lesson{flex:1;display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.lesson:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.lesson em{font:900 30px 'Fraunces',serif;color:var(--acc);font-style:normal;min-width:40px}
.lesson b{display:block;font:700 17px/1.2 'Fraunces',serif;margin-bottom:3px}
.lesson span{font-size:12px;color:var(--sub)}
.del{background:none;border:2px solid var(--ink);border-radius:10px;width:46px;cursor:pointer;font-size:15px;opacity:.7}
.empty{text-align:center;color:var(--sub);padding:26px 6px;line-height:1.6}
details{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
pre{background:var(--card);border:1px solid var(--ink);padding:10px;border-radius:6px;overflow-x:auto;font-size:11px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ticks{display:flex;gap:3px;flex:1}.ticks i{flex:1;height:8px;border:1.5px solid var(--ink);border-radius:2px;background:var(--card)}.ticks i.on{background:var(--acc)}
.q{font:700 22px/1.3 'Fraunces',serif;margin-bottom:16px}
.img{display:block;width:100%;max-height:300px;object-fit:contain;border:2px solid var(--ink);border-radius:8px;margin-bottom:16px;background:#fff;cursor:zoom-in}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:13px;font-size:15px;font-weight:700;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.opt u{text-decoration:none;flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:900 13px 'Fraunces',serif}
.opt.sel{background:var(--sel)}.opt.sel u{background:var(--ink);color:var(--card)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:3px 3px 0 var(--ok)}.opt.ok u{border-color:var(--ok);background:var(--ok);color:var(--card)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.foot{margin-top:auto;padding-top:20px}
.res{text-align:center;margin:auto 0}.res .t{font-size:60px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;z-index:20;overflow:auto}
#zoom img{margin:auto;max-width:none;width:180%;background:#fff}
.rem{border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--card);margin-top:6px;font-size:13px;line-height:1.7}.rem input{font:inherit;border:2px solid var(--ink);border-radius:6px;padding:6px;background:var(--paper);color:var(--ink)}.rem .btn{padding:6px 12px;font-size:13px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.a{animation:up .5s both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@keyframes blink{50%{opacity:.4}}
@keyframes bump{40%{transform:scale(1.25)}}
.enter{animation:slide .3s both}.bump{animation:bump .4s}
.opt.ok{animation:pop .4s}.opt.no{animation:shake .4s}
.hero{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:14px}
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{transform:rotate(-90deg);width:76px;height:76px}.ring circle{fill:none;stroke-width:5}
.rb{stroke:var(--ink);opacity:.15}.rf{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:113;stroke-dashoffset:113;transition:stroke-dashoffset 1.1s .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 20px 'Fraunces',serif}
.hi{font:900 22px/1.1 'Fraunces',serif}.hs{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.5}
.wk{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--sub)}.wd.today{color:var(--ink)}
.wd i{width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px}.wd.on i{background:var(--acc);color:#fff}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.st{border:2px solid var(--ink);border-radius:10px;padding:10px 4px;text-align:center;background:var(--card)}.st b{display:block;font:900 20px 'Fraunces',serif}.st span{font-size:11px;color:var(--sub)}
.sug{background:var(--acc);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:20px}
.sug small{font-weight:700;font-size:12px;opacity:.9}.sug b{display:block;font:900 20px/1.2 'Fraunces',serif;margin:4px 0 12px}.sug .btn{background:var(--card);color:var(--ink)}
h3.sec{font:900 18px 'Fraunces',serif;margin:6px 0 12px}
.pill{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;border:1.5px solid var(--ink);border-radius:99px;padding:1px 8px;color:var(--ink)}
.tm{font:900 16px 'Fraunces',serif;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;background:var(--card);min-width:62px;text-align:center}.tm.low{color:var(--bad);border-color:var(--bad);animation:blink 1s infinite}
.ans{width:100%;font:700 18px 'DM Sans',sans-serif;padding:14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);outline:none;box-shadow:3px 3px 0 var(--ink)}
.ans.ok{border-color:var(--ok);background:var(--okbg)}.ans.no{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.stmt{border:2px dashed var(--ink);border-radius:10px;padding:14px;margin-bottom:14px;font-size:16px;line-height:1.45}
.fb{margin-top:14px;padding:12px;border-radius:10px;border:2px solid var(--ink);background:var(--card);font-size:14px;line-height:1.5;animation:up .3s}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}.chip{border:2px solid var(--ink);border-radius:10px;padding:12px 6px;font-weight:700;background:var(--card);cursor:pointer;font-size:14px}.chip.on{background:var(--ink);color:var(--card)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;z-index:15}
.sh{margin:auto auto 0;width:100%;max-width:480px;background:var(--paper);border:2px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:sheet .25s}
.sh h3{font:900 22px/1.15 'Fraunces',serif;margin:0 0 4px}
details.arc{margin:8px 0 14px}details.arc summary{cursor:pointer;font:900 16px 'Fraunces',serif;padding:6px 0}
.rs{display:flex;gap:10px;justify-content:center;margin:18px 0}.rs div{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--card);min-width:92px}.rs b{display:block;font:900 24px 'Fraunces',serif}.rs span{font-size:11px;color:var(--sub)}
.trophy{animation:pop .8s .2s both}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}#conf i{position:absolute;top:-14px;width:8px;height:13px;animation:fall linear forwards}
.bt{display:flex;gap:8px}.bt .btn{flex:1}

.xpf{position:fixed;z-index:40;pointer-events:none;font:900 38px 'Fraunces',serif;color:var(--acc);text-align:center;text-shadow:0 3px 0 var(--ink),0 0 14px rgba(224,165,38,.8);white-space:nowrap}
.xpf small{display:block;font:700 12px 'DM Sans',sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;margin-top:4px;text-shadow:none}
.xpp{position:fixed;z-index:40;pointer-events:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);margin:-6px 0 0 -6px}
#lvb{position:fixed;left:50%;top:38%;z-index:45;background:var(--ink);color:var(--card);padding:18px 30px;border-radius:14px;font:900 32px 'Fraunces',serif;border:3px solid var(--acc);box-shadow:6px 6px 0 var(--acc);pointer-events:none;white-space:nowrap}
.lbar{display:block;height:8px;border:1.5px solid var(--ink);border-radius:99px;margin-top:6px;overflow:hidden;background:var(--paper)}.lbar i{display:block;height:100%;background:var(--acc)}

:root{--g1:#FFD9C7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2B2147}}
:root[data-theme="dark"]{--g1:#2B2147}
body{background:linear-gradient(180deg,var(--g1),transparent 340px) no-repeat,var(--paper)}
header{background:var(--g1)}
.stats .stamp{background:var(--card);background:color-mix(in srgb,var(--cc) 38%,var(--card))}
.stats .stamp:nth-child(1){--cc:#F0623D}.stats .stamp:nth-child(2){--cc:#F5B82E}.stats .stamp:nth-child(3){--cc:#8B5CF6}
.st{background:var(--card);background:color-mix(in srgb,var(--cc,#fff) 24%,var(--card))}
.hero{background:linear-gradient(135deg,var(--acc),#F5B82E);color:#fff}
.hero .hi,.hero .hs b,.hero .ring b{color:#fff}.hero .hs{color:rgba(255,255,255,.93)}
.hero .rb{stroke:#fff;opacity:.35}.hero .rf{stroke:#fff}.hero .lbar{background:rgba(255,255,255,.3);border-color:#fff}.hero .lbar i{background:#fff}
.sug{background:linear-gradient(135deg,#8B5CF6,var(--acc))}
.lesson{border-left:10px solid var(--cc,var(--acc))}.lesson em{color:var(--cc,var(--acc))}
.opt:nth-child(5n+1) u{background:#F0623D;color:#fff}.opt:nth-child(5n+2) u{background:#3B82F6;color:#fff}.opt:nth-child(5n+3) u{background:#22A559;color:#fff}.opt:nth-child(5n+4) u{background:#8B5CF6;color:#fff}.opt:nth-child(5n+5) u{background:#F5B82E;color:#1B2A41}
.opt.sel u{background:var(--ink)!important;color:var(--card)!important}.opt.ok u{background:var(--ok)!important;color:var(--card)!important;border-color:var(--ok)}
.ticks i.on{background:var(--acc)}
.stars{position:relative;display:inline-block;font-style:normal;font-weight:400;font-size:18px;line-height:1;letter-spacing:1px;color:rgba(128,128,128,.4);vertical-align:middle}
.stars .sf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;font-style:normal;color:#F5B82E}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;z-index:8;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px;cursor:pointer}
#nav span{font-size:11px;font-weight:700;color:var(--sub)}#nav button.on span{color:var(--acc)}#nav button.on{box-shadow:inset 0 3px 0 var(--acc)}
.hasnav main{padding-bottom:98px}
.card{border:2px solid var(--ink);border-radius:12px;padding:14px;background:var(--card);margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:9px;color:var(--sub)}
.bar i{width:100%;background:var(--acc);border:1.5px solid var(--ink);border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow .6s both;animation-delay:calc(var(--d)*40ms)}.bar i.z{background:transparent;opacity:.35}
@keyframes grow{from{transform:scaleY(0)}}
.gen{font-size:14px;margin-bottom:8px}.gen b{display:block;font:900 36px 'Fraunces',serif;color:var(--acc)}
.srow,.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(128,128,128,.3)}
.srow .dot{width:14px;height:14px;border-radius:50%;background:var(--cc);flex:none}.srow b,.lrow>div{flex:1}.av{font:900 22px 'Fraunces',serif}
.lrow b{display:block;font-size:14px}.lrow span{font-size:11px;color:var(--sub)}
.scard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--card);background:color-mix(in srgb,var(--cc) 28%,var(--card))}
.scard b{font:900 19px 'Fraunces',serif;display:block}.scard span{font-size:12px;color:var(--sub)}
.shead{border:2px solid var(--ink);border-radius:14px;padding:18px;text-align:center;color:#fff;background:var(--cc);box-shadow:4px 4px 0 var(--ink);margin-bottom:14px}.shead h2{margin:0}.gbig{font:900 54px/1.1 'Fraunces',serif}
.gadd{display:flex;gap:8px;margin-bottom:12px}.gadd .ans{flex:1}
.gl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.gc{border:2px solid var(--ink);border-radius:99px;padding:6px 12px;background:var(--cc);color:#fff;font-weight:700;cursor:pointer}.gc small{opacity:.85;margin:0 4px;font-weight:500}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}.sw .on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.fold{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-left:10px solid var(--cc,var(--ink));border-radius:10px;padding:14px;margin-bottom:10px;background:var(--card);font:700 16px 'DM Sans',sans-serif;cursor:pointer}
select.sel{width:100%;font:700 15px 'DM Sans',sans-serif;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="brand">Master<i>y</i></div><div class="stats"><span class="stamp">🔥 <span id="streak">0</span></span><span class="stamp" id="xpst">⚡ <span id="xp">0</span></span><span class="stamp" id="lvst">Nv <span id="lv">1</span></span></div></div>
  <button class="btn" id="add">+ Adaugă</button>
  <input type="file" id="file" class="hide" accept=".json,application/json,image/*" multiple>
</header>
<main>
  <section id="v-home"></section>
  <section id="v-prog" class="hide"></section>
  <section id="v-subj" class="hide"></section>
  <section id="v-quiz" class="hide">
    <div class="top"><button class="btn ghost" id="exit" aria-label="Ieși" style="padding:6px 12px">✕</button><div class="ticks" id="ticks"></div><div class="tm" id="tm">10:00</div></div>
    <div id="qw">
      <div class="q" id="qt"></div>
      <img class="img hide" id="qi" alt="Imagine întrebare">
      <div class="stmt hide" id="stmt"></div>
      <div class="opts" id="opts"></div>
      <div class="fb hide" id="fb"></div>
    </div>
    <div class="foot"><button class="btn big" id="go" disabled>Verifică</button></div>
  </section>
  <section id="v-res" class="hide res">
    <div class="t trophy" id="rt">🏆</div><h2 id="rh">Lecție finalizată!</h2>
    <div class="rs"><div><b id="r1">0</b><span>corecte din prima</span></div><div><b id="r2">+0</b><span>XP</span></div><div><b id="r3">0</b><span>serie 🔥</span></div></div>
    <div class="fb hide" id="rb" style="text-align:left"></div>
    <p id="rd" style="color:var(--sub);line-height:1.6"></p>
    <button class="btn big" id="home" style="margin-top:12px">Înapoi la meniu</button>
  </section>
</main>
</div>
<nav id="nav" class="hide"><button data-v="home">🏠<span>Acasă</span></button><button data-v="subj">📚<span>Materii</span></button><button data-v="prog">📈<span>Progres</span></button></nav>
<div id="sheet" class="hide"></div>
<div id="zoom" class="hide"><img alt=""></div>
<div id="lvb" class="hide"></div>
<div id="conf"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const db=new Promise(r=>{try{const q=indexedDB.open('mastery',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const kvGet=async k=>{const d=await db;return d?new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}):null};
const kvSet=async(k,v)=>{const d=await db;return d?new Promise(r=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}):false};
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LIMIT=600000;
const COLORS=['#F0623D','#F5B82E','#14A89A','#3B82F6','#8B5CF6','#EC4899','#22A559','#0EA5E9'];
const xpMax=l=>l.questions.length*25+40;
const grant=(l,n)=>{const g=Math.max(0,Math.min(n,xpMax(l)-(l.xp||0)));l.xp=(l.xp||0)+g;return g};
const stars=l=>`<i class="stars">★★★★★<i class="sf" style="width:${Math.min(100,(l.xp||0)/xpMax(l)*100)}%">★★★★★</i></i>`;
const fmt=v=>(Math.round(v*100+1e-9)/100).toFixed(2).replace('.',',');
const resetAcc=()=>document.documentElement.style.removeProperty('--acc');
const need=L=>100*L*(L-1),lvl=x=>{let L=1;while(x>=need(L+1))L++;return L};

function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 f.forEach((x,i)=>{const t=ac.currentTime+i*d,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=x;o.connect(g);g.connect(ac.destination);

// ---- potrivire tolerantă a răspunsurilor scrise
const AB={g:'golful',m:'marea',str:'stramtoarea',vf:'varful',c:'campia',arh:'arhipelagul',pen:'peninsula'};
const GEN=new Set(['marea','golful','insula','peninsula','capul','stramtoarea','muntii','muntele','podisul','campia','arhipelagul','varful','oceanul']);
const tok=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean).map(w=>AB[w]||w);
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
const close=(a,b)=>{const L=Math.max(a.length,b.length);return a===b||lev(a,b)<=(L>=6?2:L>=4?1:0)};
function matches(inp,q){
  const tt=tok(inp);if(!tt.length)return false;
  return [q.options[q.correctIndex],...(q.accept||[])].some(a=>{
    const ta=tok(a);
    if(close(tt.join(' '),ta.join(' ')))return true;
    const gA=ta.filter(w=>GEN.has(w)),gT=tt.filter(w=>GEN.has(w));
    if(gT.length&&gA.length&&!gT.some(w=>gA.includes(w)))return false;
    const cA=ta.filter(w=>!GEN.has(w)&&w.length>2),cT=tt.filter(w=>!GEN.has(w)&&w.length>2);
    if(!cA.length||!cT.length)return false;
    return cA.every(w=>cT.some(x=>close(w,x)))&&cT.every(x=>cA.some(w=>close(w,x)));
  });
}

}

  const to=$('xpst').getBoundingClientRect(),tx=to.left+to.width/2-cx,ty=to.top+to.height/2-cy,N=Math.min(16,5+Math.ceil(n/2));

  const step=Math.max(18,Math.min(45,1200/n));

}

  <div class="gl">${x.grades.map((g,k)=>`<button class="gc" data-dg="${k}" data-id="${id}" style="--cc:${x.color}">${String(g.v).replace('.',',')}<small>${g.d.slice(5).split('-').reverse().join('.')}</small>✕</button>`).join('')||'<p class="sub">Nicio notă încă.</p>'}</div>
  <h3 class="sec">Lecții în folder</h3>${ls.map((l,k)=>lessonCard(l,k,k)).join('')||'<p class="sub">Nicio lecție. O muți din fereastra lecției, la „Materie".</p>'}
  <button class="btn ghost" data-ds="${id}" style="margin-top:14px">🗑 Șterge materia</button>`;
}
$('v-subj').onclick=e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.o)openSubj(D.o);else if(D.back)subj();
  else if(b.id==='ns')subjForm(()=>subj());
  else if(b.id==='ag'){const v=parseFloat($('gv').value.replace(',','.'));if(!(v>=1&&v<=10)){alert('Scrie o notă între 1 și 10.');return}
    S.subjects.find(x=>x.id===D.id).grades.push({v:Math.round(v*100)/100,d:day()});saveS();buzz(15);openSubj(D.id)}
  else if(D.dg!==undefined){S.subjects.find(x=>x.id===D.id).grades.splice(+D.dg,1);saveS();openSubj(D.id)}
  else if(D.ds){if(confirm('Ștergi materia? Lecțiile rămân, fără folder.')){S.subjects=S.subjects.filter(x=>x.id!==D.ds);S.lessons.forEach(l=>{if(l.sid===D.ds)l.sid=null});saveS();saveL();subj()}}
  else if(D.s)openSheet(D.s);
  else if(D.a){byId(D.a).archived=true;saveL();openSubj(curSubj)}};
function prog(){
  stopT();Q=null;resetAcc();curSubj=null;show('prog');head();
  const ds=[];for(let i=13;i>=0;i--){const k=day(i);ds.push([k,S.days[k]||0])}const mx=Math.max(1,...ds.map(d=>d[1]));
  const wg=S.subjects.filter(x=>x.grades.length),gen=wg.length?wg.reduce((a,x)=>a+avgOf(x),0)/wg.length:null;
  const act=S.lessons.filter(l=>!l.archived),ratio=l=>Math.min(1,(l.xp||0)/xpMax(l)),tot=act.reduce((a,l)=>a+ratio(l)*5,0);
  let i=0,H=`<h2 class="a" style="--i:${i++}">Progresul tău</h2><div class="stats3 a" style="--i:${i++}"><div class="st" style="--cc:#8B5CF6"><b>${lvl(S.xp)}</b><span>nivel</span></div><div class="st" style="--cc:#F5B82E"><b>${S.xp}</b><span>XP total</span></div><div class="st" style="--cc:#14A89A"><b>${tot.toFixed(1).replace('.',',')}</b><span>stele din ${act.length*5}</span></div></div>
  <div class="card a" style="--i:${i++}"><h3 class="sec">Ultimele 14 zile</h3><div class="bars">${ds.map(([k,n],j)=>`<div class="bar"><i class="${n?'':'z'}" style="height:${Math.max(4,n/mx*100)}%;--d:${j}"></i><span>${k.slice(8)}</span></div>`).join('')}</div></div>
  <div class="card a" style="--i:${i++}"><h3 class="sec">Medii pe materii</h3>${gen!==null?`<div class="gen">Media generală<b>${fmt(gen)}</b></div>`:'<p class="sub">Adaugă note la „Materii" ca să vezi mediile.</p>'}${S.subjects.map(x=>{const a=avgOf(x);return `<div class="srow" style="--cc:${x.color}"><span class="dot"></span><b>${esc(x.name)}</b><span class="av">${a===null?'–':fmt(a)}</span></div>`}).join('')}</div>
  <div class="card a" style="--i:${i++}"><h3 class="sec">Lecții · ce mai poți câștiga</h3>${[...act].sort((a,b)=>ratio(a)-ratio(b)).map(l=>`<div class="lrow"><div><b>${esc(l.title)}</b><span>${l.plays||0}× · ${l.best!=null?'record '+l.best+'% · ':''}${l.xp||0}/${xpMax(l)} XP</span></div>${stars(l)}</div>`).join('')||'<p class="sub">Nicio lecție încă.</p>'}</div>`;
  $('v-prog').innerHTML=H+'<div class="card"><h3 class="sec">Setări</h3><button class="btn" id="vt">📳 Test vibrații</button><pre id="vo" style="white-space:pre-wrap;font-size:12px"></pre></div>';
}
$('v-prog').onclick=async e=>{if(e.target.id!=='vt')return;const o=$('vo'),L=[],C=window.Capacitor;
  L.push('Capacitor: '+(C?'da':'nu')+(C&&C.isNativePlatform?' · nativ: '+C.isNativePlatform():''));
  L.push('Haptics: '+(HP?'da':'nu')+' · Notificări: '+(LN?'da':'nu')+' · navigator.vibrate: '+typeof navigator.vibrate);o.textContent=L.join('\n');
  try{if(HP){await HP.vibrate({duration:500});L.push('Haptics.vibrate: OK (ai simțit?)')}}catch(err){L.push('Haptics.vibrate EROARE: '+((err&&err.message)||err))}
  try{L.push('navigator.vibrate: '+navigator.vibrate(500))}catch(err){L.push('navigator.vibrate EROARE: '+err)}
  o.textContent=L.join('\n')};
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;buzz(15);({home,subj,prog})[b.dataset.v]()};

// ---- import
const valid=l=>l&&typeof l.title==='string'&&Array.isArray(l.questions)&&l.questions.length&&l.questions.every(q=>q&&typeof q.question==='string'&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.correctIndex)&&q.correctIndex>=0&&q.correctIndex<q.options.length);
function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
  im.onerror=()=>res(null);im.src=u})}
$('add').onclick=()=>{buzz(15);$('file').click()};
$('file').onchange=async e=>{
  const files=[...e.target.files],imgs={},cache={};
  files.filter(f=>f.type.startsWith('image/')).forEach(f=>imgs[f.name.toLowerCase()]=f);
  let ok=0,bad=0,miss=[];const added=[];
  for(const f of files.filter(f=>!f.type.startsWith('image/'))){
    try{const d=JSON.parse(await f.text());
      for(const l of (Array.isArray(d)?d:[d])){
        if(!valid(l)){bad++;continue}
        for(const q of l.questions){
          if(!q.image||/^(data:|https?:)/i.test(q.image))continue;
          const nm=String(q.image).toLowerCase().split('/').pop(),file=imgs[nm];
          if(file&&!(nm in cache))cache[nm]=await shrink(file);
          if(cache[nm])q.image=cache[nm];else{miss.push(q.image);delete q.image}
        }
        l.id=uid();S.lessons.push(l);added.push(l);ok++}
    }catch(err){bad++}
  }
  e.target.value='';saveL();home();if(added.length)askFolder(added);
  let m='';if(bad)m+=`${bad} fișier(e) cu format invalid. `;if(miss.length)m+=`Imagini negăsite (alege-le odată cu JSON-ul): ${[...new Set(miss)].join(', ')}`;
  if(m)alert(m);
};

// ---- lecția
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const canType=q=>q.options[q.correctIndex].length<=70;
function start(id){
  const l=byId(id),sj=subjOf(l);if(sj)document.documentElement.style.setProperty('--acc',sj.color);
  Q={l,queue:shuffle(l.questions.map((_,k)=>k)),retry:new Set(),total:l.questions.length,done:0,first:0,gain:0,dl:Date.now()+LIMIT,over:false};
  $('ticks').innerHTML='<i></i>'.repeat(Q.total);show('quiz');tick();Q.tmr=setInterval(tick,500);load();
}
function stopT(){if(Q&&Q.tmr){clearInterval(Q.tmr);Q.tmr=0}}
function tick(){if(!Q||Q.over)return;const s=Math.max(0,Math.ceil((Q.dl-Date.now())/1000));$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('tm').classList.toggle('low',s<=60);if(s<=0)finish(true)}
const ticks=()=>document.querySelectorAll('#ticks i').forEach((t,i)=>t.classList.toggle('on',i<Q.done));
function load(){
  const idx=Q.queue[0],q=Q.l.questions[idx];Q.cur=idx;Q.t0=performance.now();Q.q=q;Q.sel=null;Q.locked=false;
  const m=S.mode;Q.kind=m==='x'?shuffle(['c','t','f'].filter(k=>k!=='t'||canType(q)))[0]:(m==='t'&&!canType(q)?'c':m);
  ticks();$('qt').textContent=q.question;
  const im=$('qi');if(q.image){im.onerror=()=>im.classList.add('hide');im.src=q.image;im.classList.remove('hide')}else im.classList.add('hide');
  const ans=q.options[q.correctIndex],O=$('opts'),st=$('stmt');$('fb').classList.add('hide');st.classList.add('hide');
  if(Q.kind==='c'){Q.perm=shuffle(q.options.map((_,i)=>i));O.innerHTML=Q.perm.map((p,i)=>`<button class="opt" data-o="${i}"><u>${String.fromCharCode(65+i)}</u>${esc(q.options[p])}</button>`).join('')}
  else if(Q.kind==='t'){O.innerHTML='<input class="ans" id="ans" placeholder="Scrie răspunsul…" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="btn ghost" id="idk" style="margin-top:12px">Nu știu</button>';
    $('ans').oninput=()=>$('go').disabled=!$('ans').value.trim();$('ans').onkeydown=e=>{if(e.key==='Enter'&&!$('go').disabled)$('go').click()};setTimeout(()=>{try{$('ans').focus()}catch(e){}},300)}
  else{const wr=q.options.filter((_,i)=>i!==q.correctIndex);Q.tfTrue=Math.random()<.5;Q.prop=Q.tfTrue?ans:wr[Math.floor(Math.random()*wr.length)];
    st.innerHTML=`Răspuns propus:<br><b>${esc(Q.prop)}</b>`;st.classList.remove('hide');
    O.innerHTML='<button class="opt" data-o="1"><u>✓</u>Adevărat</button><button class="opt" data-o="0"><u>✗</u>Fals</button>'}
  $('go').textContent='Verifică';$('go').disabled=Q.kind!=='c'&&Q.kind!=='f'?true:true;
  const w=$('qw');w.classList.remove('enter');void w.offsetWidth;w.classList.add('enter');
}
$('qi').onclick=()=>{$('zoom').firstElementChild.src=$('qi').src;$('zoom').classList.remove('hide')};
$('zoom').onclick=()=>$('zoom').classList.add('hide');
$('opts').onclick=e=>{
  if(Q.locked)return;
  if(e.target.id==='idk'){check(true);return}
  const b=e.target.closest('[data-o]');if(!b)return;
  buzz(15);Q.sel=+b.dataset.o;
  document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('go').disabled=false;
};
function resolve(good){
  const idx=Q.cur,q=Q.q;Q.prevRetry=Q.retry.has(idx);let n=0,parts=[];
  if(good){
    const first=!Q.retry.has(idx),base={c:10,f:6,t:20}[Q.kind];Q.combo=(Q.combo||0)+1;
    if(first){n=base;parts.push([{c:'grilă',f:'adev/fals',t:'scris'}[Q.kind],base]);
      if(performance.now()-Q.t0<(Q.kind==='t'?15000:7000)){n+=3;parts.push(['rapid',3])}
      if(Q.combo>=2){const cb=Math.min(Q.combo-1,5)*2;n+=cb;parts.push(['serie ×'+Q.combo,cb])}
      if(q.m>0){n+=5;parts.push(['revanșă',5]);q.m--}
      Q.first++}
    else{n=Math.ceil(base/2);parts.push(['repetare',n])}
    const g=grant(Q.l,n);Q.gain+=g;Q.queue.shift();Q.done++;beep([523,659,784],.1);
    const L0=lvl(S.xp);S.xp+=g;save();head(true);
    const fe=document.querySelector('.opt.ok')||$('ans')||$('qw');
    if(g>0)xpAnim(g,g<n?[...parts,['maxim lecție',0]]:parts,fe,lvl(S.xp)>L0);else{buzz(30);noteAnim(fe)}
  }else{Q.combo=0;q.m=Math.min(5,(q.m||0)+1);buzz([80,100,80]);beep([220,174],.18);Q.retry.add(idx);Q.queue.push(Q.queue.shift());save();head(true)}
  ticks();$('go').textContent=Q.queue.length?'Continuă':'Finalizează';$('go').disabled=false;
}
function check(idk){
  if(Q.locked)return;Q.locked=true;const q=Q.q,ans=q.options[q.correctIndex],fb=$('fb');let good;
  if(Q.kind==='c'){good=Q.perm[Q.sel]===q.correctIndex;document.querySelectorAll('.opt').forEach((b,i)=>{b.classList.remove('sel');if(Q.perm[i]===q.correctIndex)b.classList.add('ok');if(i===Q.sel&&!good)b.classList.add('no')})}
  else if(Q.kind==='t'){const a=$('ans');a.disabled=true;good=!idk&&matches(a.value,q);a.classList.add(good?'ok':'no');$('idk').classList.add('hide');
    if(!good){fb.innerHTML=`Răspuns corect: <b>${esc(ans)}</b>${idk?'':'<br><button class="btn ghost" id="ovr" style="margin-top:8px">Am scris corect</button>'}`;fb.classList.remove('hide')}}
  else{good=(Q.sel===1)===Q.tfTrue;document.querySelectorAll('.opt').forEach(b=>{b.classList.remove('sel');const v=+b.dataset.o===1;if(v===Q.tfTrue)b.classList.add('ok');else if(+b.dataset.o===Q.sel)b.classList.add('no')});
    fb.innerHTML=`Răspuns corect: <b>${esc(ans)}</b>`;fb.classList.remove('hide')}
  resolve(good);
}
$('fb').onclick=e=>{if(e.target.id!=='ovr')return;
  Q.queue.unshift(Q.queue.pop());if(!Q.prevRetry)Q.retry.delete(Q.cur);if(Q.q.m>0)Q.q.m--;
  $('ans').classList.remove('no');$('ans').classList.add('ok');$('fb').classList.add('hide');resolve(true)};
$('go').onclick=()=>{if(Q.locked){buzz(15);Q.queue.length?load():finish(false)}else check(false)};
function finish(timeUp){
  if(Q.over)return;Q.over=true;stopT();const t=day(),l=Q.l,firstToday=Q.done>0&&!S.days[t];
  if(Q.done>0){if(S.last!==t){S.streak=S.last===day(1)?S.streak+1:1;S.last=t}S.days[t]=(S.days[t]||0)+1;
    const ks=Object.keys(S.days).sort().slice(-40);S.days=Object.fromEntries(ks.map(k=>[k,S.days[k]]))}
  const pct=Math.round(Q.first/Q.total*100);l.plays=(l.plays||0)+1;l.lastPct=pct;l.lastDate=t;l.best=Math.max(l.best||0,pct);
  let bonus=0;const lines=[];
  if(!timeUp&&Q.done===Q.total){const g=grant(l,pct===100?40:15);if(g>0){bonus+=g;lines.push([pct===100?'Lecție perfectă':'Lecție terminată',g])}else lines.push(['Ai luat tot XP-ul de la această lecție ⭐',0])}
  if(firstToday){const b=10+Math.min(S.streak,10)*2;bonus+=b;lines.push([`Prima lecție de azi · serie 🔥${S.streak}`,b])}
  const L0=lvl(S.xp);S.xp+=bonus;Q.gain+=bonus;const up=lvl(S.xp)>L0;
  save();saveL();head(true);$('xp').textContent=S.xp-bonus;$('lv').textContent=lvl(S.xp-bonus);show('res');
  $('rt').textContent=timeUp?'⏱️':'🏆';$('rh').textContent=timeUp?'Timpul a expirat':'Lecție terminată!';
  $('rd').textContent=timeUp?`Ai răspuns la ${Q.done} din ${Q.total} întrebări în 10 minute.`:(pct>=90?'Excelent! Mâine o repeți și mai bine.':pct>=60?'Bine! Repetă mâine ca să se fixeze.':'Mai repetă-o — greșelile revin oricum în lecție.');
  const rb=$('rb');rb.innerHTML=lines.map(x=>x[1]?`<div>+${x[1]} · ${x[0]}</div>`:`<div>${x[0]}</div>`).join('');rb.classList.toggle('hide',!lines.length);
  countUp($('r1'),Q.first,'','/'+Q.total);countUp($('r2'),Q.gain,'+');countUp($('r3'),S.streak);
  if(!timeUp&&pct>=60)confetti();
  if(bonus)setTimeout(()=>xpAnim(bonus,lines,$('r2'),up),700);else{head()}
}
$('exit').onclick=()=>{if(confirm('Ieși din lecție? XP-ul câștigat rămâne salvat.')){stopT();saveL();home()}};
$('home').onclick=home;

function demo(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180"><rect width="300" height="180" fill="#cfe3ee"/><path d="M40 120 L70 60 L130 40 L190 55 L250 90 L220 140 L140 160 L80 150Z" fill="#e8dcb5" stroke="#1B2A41" stroke-width="2"/><circle cx="150" cy="95" r="9" fill="#D9562B" stroke="#1B2A41" stroke-width="2"/></svg>`;
  return{id:uid(),title:'Demo: Hartă mută',subject:'Geografie',questions:[
  {question:'Ce reprezintă punctul roșu de pe hartă?',image:'data:image/svg+xml,'+encodeURIComponent(svg),options:['Capitala','Un munte','Un râu','Un lac','Un port'],correctIndex:0},
  {question:'Care este capitala Spaniei?',options:['Barcelona','Sevilla','Madrid','Valencia','Bilbao'],correctIndex:2}]}}

(async()=>{S.lessons=(await kvGet('lessons'))||store.get('m_lessons',[]);S.lessons.forEach(l=>{if(!l.id)l.id=uid()});home()})();
</script>
